
      - name: Extract Android project
        shell: bash
        run: |
          mkdir -p source
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "File ZIP tidak ditemukan"
            ls -la
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d source

          PROJECT_DIR=$(find source -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "File proyek Android tidak ditemukan di ZIP"
            find source -maxdepth 4 -type f | head -50
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
